name: Bug report
description: Something does not work as described in the README.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **do not post your door's IP address** or other
        details about your network. The diagnostics download below already hides it.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.8.2"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Door firmware version (petWALK app)
      placeholder: "5.2"
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >
        Settings → Devices & services → petWALK Local → ⋮ → Download diagnostics.
        Paste the file content here. The door's address is redacted.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: Lines from the Home Assistant log mentioning `petwalk_local`.
      render: text
