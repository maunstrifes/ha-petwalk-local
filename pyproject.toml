[project]
name = "ha-petwalk-local"
description = "Home Assistant integration for the petWALK.control local API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dynamic = ["version"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "D",     # pydocstyle
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "LOG",   # flake8-logging
    "N",     # pep8-naming
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "RUF",   # ruff-specific
    "SIM",   # flake8-simplify
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.petwalk_local"]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components", "scripts", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# The test harness ships no type information.
[[tool.mypy.overrides]]
module = "pytest_homeassistant_custom_component.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["custom_components/petwalk_local"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
